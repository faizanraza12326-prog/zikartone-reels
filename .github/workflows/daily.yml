name: Daily reel

on:
  schedule:
    - cron: '0 14 * * *'      # 14:00 UTC = 7:00 PM Pakistan time, every day
  workflow_dispatch:
    inputs:
      date:
        description: 'Date to post (YYYY-MM-DD). Leave empty for today.'
        required: false

permissions:
  contents: write

jobs:
  reel:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q -r requirements.txt
          bash setup_assets.sh
      - name: Make the reel
        id: make
        run: python make_reel.py ${{ github.event.inputs.date && format('--date {0}', github.event.inputs.date) || '' }}
      - name: Keep a copy (downloadable for 30 days)
        if: steps.make.outputs.base
        uses: actions/upload-artifact@v4
        with:
          name: reel-${{ github.run_number }}
          path: out/*.*
          retention-days: 30
      - name: Instagram + Facebook
        if: steps.make.outputs.base
        continue-on-error: true
        env:
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python upload_meta.py "${{ steps.make.outputs.base }}"
      - name: YouTube Shorts
        if: steps.make.outputs.base
        continue-on-error: true
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_PRIVACY: ${{ vars.YT_PRIVACY || 'public' }}
        run: python upload_youtube.py "${{ steps.make.outputs.base }}"
      # GitHub pauses scheduled workflows after 60 days without repository activity.
      # A one-line log commit each day keeps the schedule alive for the whole year.
      - name: Log the run
        if: always()
        run: |
          echo "$(date -u +%F) run ${{ github.run_number }} ${{ steps.make.outputs.base && 'made' || 'nothing scheduled' }}" >> posted.log
          git config user.name "zikartone-bot"
          git config user.email "zikartone-bot@users.noreply.github.com"
          git add posted.log && git commit -qm "Daily reel log" && git push -q || true
