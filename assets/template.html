<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:AQ;src:url(fonts/amiri-quran-arabic-400-normal.woff2)}
@font-face{font-family:P;font-weight:400;src:url(fonts/poppins-latin-400-normal.woff2)}
@font-face{font-family:P;font-weight:600;src:url(fonts/poppins-latin-600-normal.woff2)}
@font-face{font-family:P;font-weight:800;src:url(fonts/poppins-latin-800-normal.woff2)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#06140d;font-family:P,sans-serif;color:#f6efd9}
#bg{position:absolute;inset:0;background:radial-gradient(120% 80% at 50% 0%,#0f3b28 0%,#0a2418 45%,#06140d 100%)}
#pat{position:absolute;inset:0;opacity:.07;background-image:radial-gradient(circle at 50% 50%,transparent 38px,#e2bd63 39px,#e2bd63 40px,transparent 41px),radial-gradient(circle at 0 0,transparent 38px,#e2bd63 39px,#e2bd63 40px,transparent 41px);background-size:80px 80px}
.top{position:absolute;top:90px;left:0;right:0;text-align:center}
.brand{display:inline-flex;align-items:center;gap:16px;font-weight:800;letter-spacing:.18em;font-size:30px;color:#e2bd63}
.brand img{width:58px;height:58px;border-radius:50%}
.tag{margin-top:26px;font-weight:800;font-size:44px;letter-spacing:.12em;color:#e2bd63}
.sub{margin-top:8px;font-size:30px;color:#bcd2c2}
.bar{position:absolute;top:330px;left:120px;right:120px;height:12px;border-radius:9px;background:rgba(255,255,255,.12);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#e2bd63,#f3d98b);border-radius:9px}
.timer{position:absolute;top:390px;left:0;right:0;text-align:center}
.ring{display:inline-grid;place-items:center;width:190px;height:190px;border-radius:50%;font-weight:800;font-size:96px;color:#f3d98b;position:relative}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.card{position:absolute;top:640px;left:90px;right:90px;padding:46px 48px;border-radius:40px;background:rgba(255,255,255,.07);border:2px solid rgba(226,189,99,.35);text-align:center}
.q{font-weight:600;font-size:46px;line-height:1.35}
.ar{font-family:AQ,serif;direction:rtl;font-size:68px;line-height:1.9;color:#f3d98b;margin-top:22px}
.opts{position:absolute;left:150px;right:150px;display:flex;flex-direction:column;gap:30px}
.opt{height:118px;border-radius:30px;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.14);display:flex;align-items:center;gap:30px;padding:0 40px;font-weight:600;font-size:46px;transition:none}
.opt b{display:inline-grid;place-items:center;width:64px;height:64px;border-radius:50%;background:rgba(226,189,99,.18);color:#e2bd63;font-size:34px;font-weight:800;flex:0 0 auto}
.opt.ok{background:#1f8a5b;border-color:#5fe0a0}
.opt.ok b{background:#fff;color:#1f8a5b}
.opt.dim{opacity:.35}
.refin{margin-top:20px;font-size:34px;color:#9fe3bd;font-weight:600}
.foot{position:absolute;bottom:120px;left:0;right:0;text-align:center;font-size:32px;color:#bcd2c2}
.foot b{color:#e2bd63}
.center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 100px}
.big{font-weight:800;font-size:96px;line-height:1.1;color:#f3d98b}
.mid{font-weight:600;font-size:46px;line-height:1.45;margin-top:34px}
.pill{margin-top:46px;display:inline-block;padding:22px 46px;border-radius:99px;background:#e2bd63;color:#06140d;font-weight:800;font-size:40px}
.logo{width:190px;height:190px;border-radius:50%;margin-bottom:40px;box-shadow:0 0 0 10px rgba(226,189,99,.15)}
</style></head>
<body><div id="bg"></div><div id="pat"></div><div id="app"></div>
<script>
const QS = window.QUIZ || [];
const INTRO = 2.6, ASK = 8, REVEAL = 2.6, OUTRO = 4.5;
const PER = ASK + REVEAL;
window.TOTAL = INTRO + QS.length * PER + OUTRO;
const app = document.getElementById('app');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ease = x => 1 - Math.pow(1 - Math.min(Math.max(x, 0), 1), 3);
const brand = '<div class="brand"><img src="logo.png" onerror="this.remove()">ZIKARTONE</div>';
window.render = function(t){
  let h = '';
  if (t < INTRO) {
    const a = ease(t / .6);
    h = `<div class="center" style="opacity:${a};transform:translateY(${(1-a)*40}px)"><img class="logo" src="logo.png" onerror="this.remove()"><div class="big">GUESS THE<br>SURAH</div>
      <div class="mid">${QS.length} sawal · har sawal ${ASK} second<br>Kitne sahi bata sakte ho?</div></div>`;
  } else if (t < INTRO + QS.length * PER) {
    const k = Math.floor((t - INTRO) / PER), lt = t - INTRO - k * PER, q = QS[k];
    const rev = lt >= ASK, left = Math.max(0, Math.ceil(ASK - lt));
    const a = ease(lt / .45);
    const prog = ((k + Math.min(lt / ASK, 1)) / QS.length) * 100;
    const frac = rev ? 0 : (ASK - lt) / ASK;
    const C = 2 * Math.PI * 85;
    h += `<div class="top">${brand}<div class="tag">GUESS THE SURAH</div><div class="sub">Sawal ${k + 1} / ${QS.length}</div></div>`;
    h += `<div class="bar"><i style="width:${prog}%"></i></div>`;
    h += `<div class="timer"><div class="ring"><svg width="190" height="190"><circle cx="95" cy="95" r="85" stroke="rgba(255,255,255,.12)" stroke-width="12" fill="none"/><circle cx="95" cy="95" r="85" stroke="${rev ? '#5fe0a0' : '#e2bd63'}" stroke-width="12" fill="none" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - (rev ? 1 : frac))}"/></svg>${rev ? '✓' : left}</div></div>`;
    h += `<div class="card" style="opacity:${a};transform:scale(${.96 + .04 * a})"><div class="q">${esc(q.q)}</div>${q.ar ? `<div class="ar">${esc(q.ar)}</div>` : ''}${rev ? `<div class="refin" style="opacity:${ease((lt - ASK) / .4)}">${esc(q.ref)}</div>` : ''}</div>`;
    const top = q.ar ? 1190 : 1040;
    h += `<div class="opts" style="top:${top}px">` + q.opts.map((o, i) => {
      const d = Math.min(Math.max((lt - .25 - i * .12) / .35, 0), 1);
      const cls = rev ? (i === q.ans ? ' ok' : ' dim') : '';
      return `<div class="opt${cls}" style="opacity:${rev && i !== q.ans ? .35 : d};transform:translateX(${(1 - ease(d)) * 60}px)${rev && i === q.ans ? ' scale(' + (1 + .04 * Math.sin(Math.min((lt - ASK) / .4, 1) * Math.PI)) + ')' : ''}"><b>${'ABCD'[i]}</b>${esc(o)}</div>`;
    }).join('') + '</div>';
    h += `<div class="foot">Score comment mein likho <b>(X/${QS.length})</b></div>`;
  } else {
    const lt = t - INTRO - QS.length * PER, a = ease(lt / .6);
    h = `<div class="center" style="opacity:${a}"><img class="logo" src="logo.png" onerror="this.remove()"><div class="big">Kitne sahi hue?</div>
      <div class="mid">Apna score comment karo 👇<br>Qur'an, Hadith aur Duas, sab free</div><div class="pill">zikartone.netlify.app</div></div>`;
  }
  app.innerHTML = h;
};
</script></body></html>
